<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Циклы в Scratch · тренажёр · 3 класс</title>
<style>
:root{
  --motion:#4C97FF; --looks:#9966FF; --sound:#CF63CF;
  --events:#FFBF00; --control:#FFAB19; --sensing:#5CB1D6;
  --operators:#59C059; --variables:#FF8C1A;
  --dark:#1F2937; --soft:#F2F7FF; --green:#2ecc71; --green-d:#22A85C;
  --orange:#FF8C1A; --blue:#4C97FF; --blue-d:#3373CC; --red:#E74C3C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{
  font-family:"Segoe UI",Arial,Roboto,Helvetica,sans-serif;
  font-size:19px; line-height:1.45; color:var(--dark);
  background:linear-gradient(150deg,#E8F3FF 0%,#FFF7EA 55%,#EAFFF1 100%);
  background-attachment:fixed; padding:18px 14px 40px;
  display:flex; justify-content:center; min-height:100vh;
}
.app{width:100%; max-width:980px}

.screen{display:none}
.screen.active{display:block; animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:#fff;border-radius:24px;padding:24px 28px 28px;
  box-shadow:0 14px 34px rgba(45,90,160,.16)}

.btn{
  font-family:inherit;font-size:19px;font-weight:700;border:none;
  border-radius:14px;padding:12px 24px;cursor:pointer;color:#fff;
  box-shadow:0 4px 0 rgba(0,0,0,.18);
  transition:transform .12s,box-shadow .12s,filter .12s;
  white-space:nowrap;
}
.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.btn-orange{background:var(--orange)}
.btn-green{background:var(--green)}
.btn-blue{background:var(--blue)}
.btn-gray{background:#9AA7B5}
.btn-big{font-size:21px;padding:15px 36px;border-radius:18px}

.start-card{text-align:center;padding:40px 28px 36px;max-width:680px;margin:0 auto}
.cat-wrap{display:flex;justify-content:center;margin-bottom:6px}
.start-card h1{font-size:36px;color:var(--orange);margin:4px 0 4px}
.sub{color:#5b7590;font-size:18px;margin-bottom:22px}
.name-box{max-width:420px;margin:0 auto 22px;text-align:left}
.name-box label{display:block;font-weight:700;margin-bottom:10px;font-size:19px}
#nameInput{
  width:100%;font-family:inherit;font-size:21px;padding:13px 18px;
  border-radius:14px;outline:none;color:var(--dark);background:#fff;
  border:3px solid var(--green);
  box-shadow:0 0 10px rgba(46,204,113,.5);transition:box-shadow .2s;
}
#nameInput:focus{box-shadow:0 0 18px rgba(46,204,113,.75)}
.mini{font-size:16px;color:#7a8ea3;margin-top:14px}
.info-pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
.info-pill{background:#EAF2FF;color:var(--blue-d);border-radius:30px;
  padding:6px 16px;font-size:15px;font-weight:700}
.info-pill.p2{background:#F3ECFF;color:#7A4DD1}
.info-pill.p3{background:#E9FBF0;color:var(--green-d)}

.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.level-badge{font-weight:700;font-size:16px;border-radius:12px;padding:6px 14px;white-space:nowrap}
.level-badge.know{background:#E9FBF0;color:var(--green-d)}
.level-badge.under{background:#EAF2FF;color:var(--blue-d)}
.level-badge.app{background:#F3ECFF;color:#7A4DD1}
.counter{font-weight:700;font-size:17px;color:#4a6379}
.streak{font-weight:700;font-size:16px;color:#E67E22;display:none}
.streak.on{display:inline-block;animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.spacer{flex:1}
.hint-btn{
  background:#F1C40F;color:#5A4500;font-family:inherit;font-weight:700;
  font-size:17px;border:none;border-radius:12px;padding:9px 16px;cursor:pointer;
  box-shadow:0 4px 0 #C9A100;transition:.15s;
}
.hint-btn:hover:not(:disabled){filter:brightness(1.08)}
.hint-btn:disabled{background:#CBD5E1;color:#7B8794;box-shadow:0 4px 0 #AEB8C4;cursor:not-allowed}

.progress{height:12px;background:#E6EEF8;border-radius:8px;overflow:hidden;margin:14px 0 18px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,#4C97FF,#2ecc71);
  border-radius:8px;transition:width .4s}

.qtext{font-size:21px;font-weight:700;margin-bottom:6px;line-height:1.4}
.qtext .hl{color:var(--orange)}
.options{display:flex;flex-direction:column;gap:11px;margin-top:16px}
.opt{
  display:flex;align-items:center;gap:13px;width:100%;
  font-family:inherit;font-size:18px;text-align:left;color:var(--dark);
  background:var(--soft);border:3px solid #D7E6FF;border-radius:14px;
  padding:12px 16px;cursor:pointer;transition:.15s;
}
.opt:hover:not(:disabled){border-color:var(--blue);background:#E8F1FF;transform:translateX(3px)}
.opt.sel{border-color:var(--orange);background:#FFF4E6;box-shadow:0 0 0 4px rgba(255,140,26,.18)}
.opt.correct{border-color:var(--green);background:#E9FBF0}
.opt.wrong{border-color:#FF5D5D;background:#FFECEC}
.opt:disabled{cursor:default}
.opt-letter{
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 32px;
  width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;
  font-weight:700;font-size:16px;
}
.opt.sel .opt-letter{background:var(--orange)}
.opt.correct .opt-letter{background:var(--green)}
.opt.wrong .opt-letter{background:#FF5D5D}

.blk{
  display:inline-flex;align-items:center;padding:8px 14px;border-radius:6px;
  color:#fff;font-weight:700;font-size:15px;position:relative;
  box-shadow:0 2px 0 rgba(0,0,0,.15);margin:3px 0;
  font-family:"Segoe UI",Arial,sans-serif;
}
.blk::after{
  content:'';position:absolute;bottom:-3px;left:14px;width:16px;height:3px;
  background:inherit;border-radius:0 0 3px 3px;
}
.blk.hat{border-radius:18px 18px 6px 6px}

.cblk{
  display:inline-block;border-radius:6px;padding:0;position:relative;
  box-shadow:0 2px 0 rgba(0,0,0,.15);margin:4px 0;min-width:200px;
}
.cblk::after{
  content:'';position:absolute;bottom:-3px;left:14px;width:16px;height:3px;
  background:inherit;border-radius:0 0 3px 3px;
}
.cblk-head{padding:8px 14px 5px;color:#fff;font-weight:700;font-size:15px}
.cblk-body{background:#fff;margin:0 4px 4px;border-radius:4px;
  padding:7px;min-height:32px;font-size:13px;color:#999;text-align:center}

.block-demo{margin:12px 0 4px;text-align:left}

.order-list{margin-top:16px}
.block-item{
  display:flex;align-items:center;gap:12px;user-select:none;
  color:#fff;font-weight:700;font-size:18px;
  border-radius:12px;padding:13px 16px;margin-bottom:9px;
  cursor:grab;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:.15s;
}
.block-item:hover{filter:brightness(1.06)}
.block-item.dragging{opacity:.4}
.block-item.sel{outline:4px solid var(--green);outline-offset:3px}
.drag-handle{opacity:.75;letter-spacing:2px}

.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.match-col{display:flex;flex-direction:column;gap:9px}
.match-item{
  border-radius:12px;padding:11px 14px;cursor:pointer;font-size:16px;
  transition:.15s;line-height:1.35;border:3px solid transparent;
}
.match-item.left{color:#fff;font-weight:700}
.match-item.left:hover{filter:brightness(1.08)}
.match-item.left.sel{outline:4px solid var(--orange);outline-offset:2px}
.match-item.left.paired{outline:3px solid var(--green);outline-offset:2px}
.match-item.right{background:var(--soft);border:3px solid #D7E6FF;color:var(--dark)}
.match-item.right:hover{border-color:var(--blue);background:#E8F1FF}
.match-item.right.used{opacity:.35;pointer-events:none}
.match-item .chip{display:block;font-size:13px;font-weight:700;margin-top:4px;color:var(--green-d)}

.num-input{
  font-family:inherit;font-size:24px;font-weight:700;text-align:center;
  width:150px;padding:11px;border-radius:14px;outline:none;color:var(--dark);
  border:3px solid var(--blue);box-shadow:0 0 0 4px rgba(76,151,255,.15);
  margin-top:14px;transition:.15s;
}
.num-input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,140,26,.2)}
.num-input:disabled{background:#F4F6F8;color:#8A98A6}

.program-stack{
  margin-top:16px;display:inline-flex;flex-direction:column;gap:4px;
  background:#F8FBFF;padding:16px;border-radius:16px;border:3px dashed #D7E6FF;
}
.prog-block{
  display:inline-flex;align-items:center;padding:10px 16px;border-radius:6px;
  color:#fff;font-weight:700;font-size:16px;position:relative;cursor:pointer;
  border:none;font-family:inherit;text-align:left;
  box-shadow:0 2px 0 rgba(0,0,0,.15);transition:.15s;
}
.prog-block:hover:not(:disabled){filter:brightness(1.08);transform:translateX(2px)}
.prog-block.sel{outline:4px solid var(--orange);outline-offset:2px}
.prog-block.correct{outline:4px solid var(--green);outline-offset:2px}
.prog-block.wrong{outline:4px solid #FF5D5D;outline-offset:2px}
.prog-block.hat{border-radius:18px 18px 6px 6px}
.prog-cblk{
  border-radius:6px;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.15);
  margin:2px 0;display:inline-block;
}
.prog-cblk-head{padding:9px 16px 5px;color:#fff;font-weight:700;font-size:16px}
.prog-cblk-body{background:#fff;margin:0 4px 4px;border-radius:4px;
  padding:6px;min-height:28px;min-width:180px;color:#bbb;font-size:13px;
  text-align:center}

.feedback{margin-top:16px;font-size:18px;font-weight:700;border-radius:14px;
  padding:0;transition:.2s}
.feedback.show{padding:13px 16px;animation:fadeUp .25s ease}
.feedback.ok{background:#E9FBF0;color:#1E8B4E;border:3px solid #A8E9C4}
.feedback.err{background:#FFECEC;color:#C0392B;border:3px solid #FFB3B3}
.hint-box{margin-top:14px;font-size:17px;background:#FFF9E0;border:3px solid #F1D96B;
  border-radius:14px;padding:11px 16px;color:#7A5C00;display:none}
.hint-box.show{display:block;animation:fadeUp .3s ease}

.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

.report-head{text-align:center;margin-bottom:20px}
.report-head h1{font-size:30px;color:var(--orange);margin-bottom:4px}
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.rep-item{background:var(--soft);border-radius:16px;padding:13px 15px;border:3px solid #D7E6FF}
.rep-item span{display:block;font-size:15px;color:#6b8299;margin-bottom:3px}
.rep-item b{font-size:20px}
.grade.g5{color:var(--green-d)}
.grade.g4{color:#2D8CEB}
.grade.g3{color:#E08B00}
.grade.g2{color:#D33}
.sect{font-size:22px;color:var(--blue-d);margin:8px 0 12px}
.err-item{background:#FFF7F7;border:3px solid #FFC7C7;border-radius:14px;
  padding:12px 16px;margin-bottom:10px}
.err-q{font-weight:700;margin-bottom:6px;font-size:17px}
.err-a{font-size:16px;margin:3px 0}
.err-a.wrong{color:#C0392B}
.err-a.right{color:#1E8B4E}
.no-errors{background:#E9FBF0;border:3px solid #A8E9C4;border-radius:14px;
  padding:16px;text-align:center;font-weight:700;color:#1E8B4E;font-size:18px}
.center{text-align:center;margin-top:22px}

.confetti{position:fixed;pointer-events:none;font-size:26px;animation:conf .9s ease-out forwards;z-index:99}
@keyframes conf{0%{opacity:1;transform:translateY(0) rotate(0)}
  100%{opacity:0;transform:translateY(-90px) rotate(180deg)}}

@media (max-width:820px){
  .report-grid{grid-template-columns:1fr 1fr}
  .match-wrap{grid-template-columns:1fr}
  .start-card h1{font-size:28px}
  body{font-size:17px}
}
</style>
</head>
<body>
<div class="app">

  <section id="screen-start" class="screen active">
    <div class="card start-card">
      <div class="cat-wrap" id="catStart"></div>
      <h1>Циклы в Scratch</h1>
      <p class="sub">Тренажёр · Информатика · 3 класс</p>

      <div class="info-pills">
        <span class="info-pill">20 заданий</span>
        <span class="info-pill p2">Без таймера</span>
        <span class="info-pill p3">Подсказки</span>
      </div>

      <div class="name-box">
        <label for="nameInput">Напиши своё имя:</label>
        <input id="nameInput" type="text" autocomplete="off" spellcheck="false">
      </div>

      <button class="btn btn-green btn-big" id="startBtn" disabled>Начать тренажёр ▶</button>
      <p class="mini">Работай в своём темпе. Удачи! 🐱</p>
    </div>
  </section>

  <section id="screen-tasks" class="screen">
    <div class="card">
      <div class="hud">
        <span class="level-badge" id="levelBadge">Знание</span>
        <span class="counter">Задание <span id="taskNum">1</span> из 20</span>
        <span class="streak" id="streakBox">🔥 0 подряд</span>
        <span class="spacer"></span>
        <button class="hint-btn" id="hintBtn">💡 Подсказка (5)</button>
      </div>
      <div class="progress"><div id="taskBar"></div></div>

      <div id="taskArea"></div>
      <div class="hint-box" id="hintBox"></div>
      <div class="feedback" id="feedback"></div>

      <div class="actions">
        <button class="btn btn-orange" id="checkBtn" disabled>Проверить ✔</button>
        <button class="btn btn-green" id="nextBtn" style="display:none">Далее →</button>
      </div>
    </div>
  </section>

  <section id="screen-report" class="screen">
    <div class="card" id="reportArea"></div>
  </section>

</div>

<script>
/* =========================================================
   ЦВЕТА SCRATCH 3
   ========================================================= */
const C = {
  motion:'#4C97FF', looks:'#9966FF', sound:'#CF63CF',
  events:'#FFBF00', control:'#FFAB19', sensing:'#5CB1D6',
  operators:'#59C059', variables:'#FF8C1A'
};

const $ = id => document.getElementById(id);

/* =========================================================
   SVG-ИКОНКИ
   ========================================================= */
function catSVG(size){
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}">
    <ellipse cx="50" cy="66" rx="30" ry="24" fill="#FFAB19"/>
    <polygon points="20,42 15,16 40,33" fill="#FFAB19"/>
    <polygon points="80,42 85,16 60,33" fill="#FFAB19"/>
    <circle cx="50" cy="44" r="32" fill="#FFAB19"/>
    <circle cx="36" cy="44" r="7" fill="#fff"/>
    <circle cx="64" cy="44" r="7" fill="#fff"/>
    <circle cx="37" cy="45" r="3.5" fill="#333"/>
    <circle cx="65" cy="45" r="3.5" fill="#333"/>
    <ellipse cx="50" cy="56" rx="5" ry="3" fill="#E64A19"/>
    <path d="M38 61 Q50 69 62 61" stroke="#333" stroke-width="2.5"
          fill="none" stroke-linecap="round"/>
    <line x1="22" y1="56" x2="8" y2="53" stroke="#333" stroke-width="2"/>
    <line x1="22" y1="61" x2="8" y2="61" stroke="#333" stroke-width="2"/>
    <line x1="78" y1="56" x2="92" y2="53" stroke="#333" stroke-width="2"/>
    <line x1="78" y1="61" x2="92" y2="61" stroke="#333" stroke-width="2"/>
  </svg>`;
}

/* Зелёный флажок Scratch */
function flagSVG(size){
  return `<svg viewBox="0 0 32 32" width="${size}" height="${size}"
      style="vertical-align:middle;margin-right:7px;flex:0 0 auto">
    <path d="M6 3 L6 29" stroke="#2E7D32" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M6 5 L24 5 L20 11 L24 17 L6 17 Z" fill="#4CAF50"/>
  </svg>`;
}

/* =========================================================
   HTML-БЛОКИ В СТИЛЕ SCRATCH 3
   ========================================================= */
function blkHTML(text, colorKey, hat){
  return `<span class="blk${hat ? ' hat' : ''}" style="background:${C[colorKey] || colorKey}">${text}</span>`;
}
function stripHTML(s){
  return String(s).replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
}

/* =========================================================
   ДАННЫЕ ЗАДАНИЙ (20)
   ========================================================= */
const TASKS = [
  /* ---------- ЗНАНИЕ (6) ---------- */
  {
    type:'choice', level:'know',
    q:'Какого цвета блок <b>«Повторить»</b> в Scratch 3?',
    options:['Синий','Оранжевый','Зелёный','Фиолетовый'],
    correct:1,
    hint:'Блок «Повторить» — оранжевый. Это цвет категории «Управление».'
  },
  {
    type:'choice', level:'know',
    q:'В какой категории Scratch 3 лежит блок <b>«Повторить»</b>?',
    options:['Движение','Внешний вид','Управление','Звук'],
    correct:2,
    hint:'Категория «Управление» — оранжевая. Там и находится блок «Повторить».'
  },
  {
    type:'choice', level:'know',
    q:'Что делает блок <b>«Повторить 5 раз»</b>?',
    options:[
      'Повторяет команды внутри 5 раз',
      'Двигает спрайт на 5 шагов',
      'Говорит фразу 5 раз',
      'Меняет костюм 5 раз'
    ],
    correct:0,
    block:{text:'Повторить 5 раз', color:'control'},
    hint:'Блок повторяет всё, что находится внутри него, 5 раз.'
  },
  {
    type:'choice', level:'know',
    q:'Верно или неверно: блок <b>«Повторить»</b> находится в категории <b>«Движение»</b>?',
    options:['Верно','Неверно'],
    correct:1,
    hint:'Нет. Блок «Повторить» находится в категории «Управление».'
  },
  {
    type:'choice', level:'know',
    q:'Какой блок в Scratch 3 является <b>блоком цикла</b>?',
    options:['Идти 5 шагов','Повторить 5 раз','Говорить «Привет!»','Ждать 1 секунду'],
    correct:1,
    hint:'Цикл — это повтор. Блок «Повторить» повторяет команды несколько раз.'
  },
  {
    type:'choice', level:'know',
    q:'Верно или неверно: блок <b>«Повторить»</b> — оранжевый.',
    options:['Верно','Неверно'],
    correct:0,
    hint:'Да! Все блоки категории «Управление», включая «Повторить», — оранжевые.'
  },

  /* ---------- ПОНИМАНИЕ (7) ---------- */
  {
    type:'choice', level:'under',
    q:'Кот выполняет: «повторить 5 раз» [ «идти 10 шагов» ]. Сколько шагов он пройдёт?',
    options:['5','10','15','50'],
    correct:3,
    block:{text:'Повторить 5 раз', color:'control'},
    hint:'5 повторов × 10 шагов = 50 шагов.'
  },
  {
    type:'choice', level:'under',
    q:'Чем <b>цикл</b> отличается от обычной последовательности команд?',
    options:[
      'Цикл повторяет команды, а последовательность — нет',
      'Цикл всегда длиннее',
      'Цикл работает только с движением',
      'Ничем не отличается'
    ],
    correct:0,
    hint:'Главное свойство цикла — повторение команд несколько раз.'
  },
  {
    type:'choice', level:'under',
    q:'Зачем нужен <b>цикл</b> в программе?',
    options:[
      'Чтобы не писать одну и ту же команду много раз',
      'Чтобы программа работала медленнее',
      'Чтобы было больше блоков',
      'Чтобы спрайт был красивее'
    ],
    correct:0,
    hint:'Цикл заменяет много одинаковых блоков одним коротким блоком.'
  },
  {
    type:'choice', level:'under',
    q:'Верно или неверно: команды, которые стоят <b>ПОСЛЕ</b> блока цикла, тоже повторяются?',
    options:['Верно','Неверно'],
    correct:1,
    hint:'Повторяются только команды ВНУТРИ блока цикла. Команды после цикла выполнятся один раз.'
  },
  {
    type:'choice', level:'under',
    q:'Что произойдёт с программой «повторить <b>0</b> раз» [ «идти 10 шагов» ]?',
    options:[
      'Кот не сделает ни одного шага',
      'Кот сделает 1 шаг',
      'Кот сделает 10 шагов',
      'Появится ошибка'
    ],
    correct:0,
    hint:'0 повторов — значит внутренние команды не выполнятся ни разу.'
  },
  {
    type:'match', level:'under',
    q:'Соотнеси блок Scratch 3 и его категорию.',
    pairs:[

  {

    q:'Соотнеси программу и результат.',
    pairs:[
      {l:'Повторить 2 раза: идти 5 шагов', r:'10 шагов'},
      {l:'Повторить 3 раза: идти 5 шагов', r:'15 шагов'},

  /* ---------- ПРИМЕНЕНИЕ (7) ---------- */
  {

    options:['Круг','Квадрат','Треугольник','Пятиугольник'],
    correct:1,

  {

    answer:7,
    hint:'Сколько раз сказал — столько и повторов. Ответ: 7.'
  },
  {

    q:'Собери программу: кот должен 4 раза пройти по 10 шагов.',
    items:['Когда щёлкнут по ' + flagSVG(20), 'Повторить 4 раза', 'Идти 10 шагов'],
    colors:['events','control','motion'],
    hint:'Сначала событие (зелёный флажок), потом блок цикла, а команда движения — внутри цикла.'
  },
  {
    type:'order', level:'app',
    q:'Собери программу: кот должен 3 раза сказать «Привет!».',
    items:['Когда щёлкнут по ' + flagSVG(20), 'Повторить 3 раза', 'Говорить «Привет!»'],
    colors:['events','control','looks'],
    hint:'Сначала событие (зелёный флажок), потом блок цикла, а команда «Говорить» — внутри цикла.'
  },
  {

    q:'Кот должен мяукнуть 5 раз, но мяукнул только 1 раз. Какой блок нужно переместить внутрь цикла? Нажми на него.',
    program:[
      {text:'Когда щёлкнут по ' + flagSVG(18), color:'events', kind:'hat'},
      {text:'Повторить 5 раз', color:'control', kind:'loop', empty:true},
      {text:'Играть звук «Мяу»', color:'sound', kind:'block'}
    ],
    correct:2,
    hint:'Блок звука стоит после цикла, а должен находиться внутри него.'
  },
  {
    type:'number', level:'app',
    q:'Сколько шагов пройдёт кот: «повторить 7 раз» [ «идти 10 шагов» ]?',
    answer:70,
    hint:'7 × 10 = 70 шагов.'
  },
  {
    type:'number', level:'app',
    q:'Кот поворачивает на 36° внутри цикла. Сколько нужно повторов, чтобы получился полный круг (360°)?',
    answer:10,
    hint:'360 : 36 = 10 повторов.'
  }
];

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
const state = {
  name:'',
  taskIdx:0,
  hintsLeft:5,
  results:[],
  streak:0,
  maxStreak:0,
  selected:null,
  order:[],
  matches:{},
  matchSel:null,
  matchRights:[],
  locked:false
};

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}
function confetti(x, y){
  const emojis = ['✨','🎉','⭐','💫','🌟'];
  for(let i = 0; i < 5; i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (x + (Math.random() - .5) * 60) + 'px';
    el.style.top  = (y + (Math.random() - .5) * 20) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }
}

/* =========================================================
   СТАРТ
   ========================================================= */
$('catStart').innerHTML = catSVG(90);

$('nameInput').addEventListener('input', e => {
  $('startBtn').disabled = e.target.value.trim().length === 0;
});
$('startBtn').addEventListener('click', () => {
  const v = $('nameInput').value.trim();
  if(!v) return;
  state.name = v;
  state.taskIdx = 0;
  state.hintsLeft = 5;
  state.results = [];
  state.streak = 0;
  state.maxStreak = 0;
  updateHintBtn();
  showScreen('screen-tasks');
  renderTask();
});

/* =========================================================
   ПОДСКАЗКИ
   ========================================================= */
function updateHintBtn(){
  const b = $('hintBtn');
  b.textContent = `💡 Подсказка (${state.hintsLeft})`;
  b.disabled = state.hintsLeft <= 0;
}
$('hintBtn').addEventListener('click', () => {
  if(state.hintsLeft <= 0) return;
  const t = TASKS[state.taskIdx];
  state.hintsLeft--;
  updateHintBtn();
  const hb = $('hintBox');
  hb.innerHTML = `💡 <b>Подсказка:</b> ${t.hint}`;
  hb.classList.add('show');
});

/* =========================================================
   РЕНДЕР ЗАДАНИЯ
   ========================================================= */
function renderTask(){
  const t = TASKS[state.taskIdx];
  state.selected = null;
  state.order = [];
  state.matches = {};
  state.matchSel = null;
  state.locked = false;

  $('taskNum').textContent = state.taskIdx + 1;
  const badge = $('levelBadge');
  badge.className = 'level-badge ' + t.level;
  badge.textContent = t.level === 'know' ? 'Знание'
                     : t.level === 'under' ? 'Понимание'
                     : 'Применение';

  $('taskBar').style.width = (state.taskIdx / TASKS.length * 100) + '%';
  $('streakBox').textContent = `🔥 ${state.streak} подряд`;
  $('streakBox').className = 'streak' + (state.streak >= 2 ? ' on' : '');

  $('feedback').className = 'feedback';
  $('feedback').innerHTML = '';
  $('hintBox').classList.remove('show');
  $('hintBox').innerHTML = '';

  $('checkBtn').style.display = '';
  $('checkBtn').disabled = true;
  $('nextBtn').style.display = 'none';
  $('nextBtn').textContent = (state.taskIdx === TASKS.length - 1) ? 'К отчёту 🏁' : 'Далее →';

  const area = $('taskArea');
  area.innerHTML = '';

  if(t.type === 'choice')    buildChoice(t, area);
  if(t.type === 'match')     buildMatch(t, area);
  if(t.type === 'order')     buildOrder(t, area);
  if(t.type === 'number')    buildNumber(t, area);
  if(t.type === 'findError') buildFindError(t, area);
}

function buildChoice(t, area){
  let html = `<div class="qtext">${t.q}</div>`;
  if(t.block){
    html += `<div class="block-demo">${blkHTML(t.block.text, t.block.color)}</div>`;
  }
  html += `<div class="options">`;
  t.options.forEach((o, i) => {
    html += `<button class="opt" data-i="${i}">
      <span class="opt-letter">${'АБВГД'[i]}</span><span>${o}</span>
    </button>`;
  });
  html += `</div>`;
  area.innerHTML = html;

  area.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if(state.locked) return;
      area.querySelectorAll('.opt').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      state.selected = +btn.dataset.i;
      $('checkBtn').disabled = false;
    });
  });
}

function buildOrder(t, area){
  state.order = shuffle(t.items.map((text, i) => ({text, id:i})));
  area.innerHTML = `<div class="qtext">${t.q}</div>
    <div class="order-list" id="orderList"></div>
    <p class="mini">Перетаскивай блоки мышкой или щёлкай по двум блокам, чтобы поменять их местами.</p>`;

  $('checkBtn').disabled = false;
  paintOrder(t);
}

function paintOrder(t){
  const list = $('orderList');
  if(!list) return;
  list.innerHTML = state.order.map((it, i) => {
    const col = C[t.colors[it.id]] || '#FFAB19';
    return `<div class="block-item${state.selected === i ? ' sel' : ''}"
              draggable="true" data-i="${i}" style="background:${col}">
      <span class="drag-handle">⠿</span><span>${it.text}</span>
    </div>`;
  }).join('');

  list.querySelectorAll('.block-item').forEach(node => {
    const i = +node.dataset.i;
    node.addEventListener('dragstart', e => {
      if(state.locked){ e.preventDefault(); return; }
      state.dragFrom = i;
      node.classList.add('dragging');
      try{ e.dataTransfer.setData('text/plain', String(i)); }catch(err){}
    });
    node.addEventListener('dragend', () => node.classList.remove('dragging'));
    node.addEventListener('dragover', e => e.preventDefault());
    node.addEventListener('drop', e => {
      e.preventDefault();
      if(state.locked) return;
      const from = state.dragFrom;
      if(from === null || from === i) return;
      const [m] = state.order.splice(from, 1);
      state.order.splice(from < i ? i - 1 : i, 0, m);
      state.selected = null;
      paintOrder(t);
    });
    node.addEventListener('click', () => {
      if(state.locked) return;
      if(state.selected === null){ state.selected = i; }
      else if(state.selected === i){ state.selected = null; }
      else {
        [state.order[state.selected], state.order[i]] =
        [state.order[i], state.order[state.selected]];
        state.selected = null;
      }
      paintOrder(t);
    });
  });
}

function buildMatch(t, area){
  state.matchRights = shuffle(t.pairs.map(p => p.r));

  let html = `<div class="qtext">${t.q}</div>
    <p class="mini">Щёлкни по блоку слева, затем по подходящей категории справа.</p>
    <div class="match-wrap"><div class="match-col">`;

  t.pairs.forEach((p, i) => {
    const col = C[p.lColor] || '#4C97FF';
    html += `<div class="match-item left" data-i="${i}"
              style="background:${col}"><span>${esc(p.l)}</span><span class="chip"></span></div>`;
  });
  html += `</div><div class="match-col">`;
  state.matchRights.forEach((r, j) => {
    html += `<div class="match-item right" data-j="${j}">${esc(r)}</div>`;
  });
  html += `</div></div>`;
  area.innerHTML = html;

  area.querySelectorAll('.match-item.left').forEach(node => {
    node.addEventListener('click', () => {
      if(state.locked) return;
      const i = +node.dataset.i;
      if(state.matches[i] !== undefined){
        delete state.matches[i];
        state.matchSel = null;
      } else {
        state.matchSel = i;
      }
      paintMatch(t);
    });
  });

  area.querySelectorAll('.match-item.right').forEach(node => {
    node.addEventListener('click', () => {
      if(state.locked) return;
      if(state.matchSel === null) return;
      const j = +node.dataset.j;
      Object.keys(state.matches).forEach(k => {
        if(state.matches[k] === j) delete state.matches[k];
      });
      state.matches[state.matchSel] = j;
      state.matchSel = null;
      paintMatch(t);
    });
  });

  paintMatch(t);
}

function paintMatch(t){
  const area = $('taskArea');
  if(!area) return;
  const lefts = area.querySelectorAll('.match-item.left');
  const rights = area.querySelectorAll('.match-item.right');
  const used = Object.values(state.matches);

  lefts.forEach(node => {
    const i = +node.dataset.i;
    const paired = state.matches[i] !== undefined;
    node.classList.toggle('paired', paired);
    node.classList.toggle('sel', state.matchSel === i);
    node.querySelector('.chip').textContent =
      paired ? '✔ ' + state.matchRights[state.matches[i]] : '';
  });
  rights.forEach(node => {
    node.classList.toggle('used', used.indexOf(+node.dataset.j) !== -1);
  });

  $('checkBtn').disabled = Object.keys(state.matches).length !== t.pairs.length;
}

function buildNumber(t, area){
  area.innerHTML = `<div class="qtext">${t.q}</div>
    <input type="number" id="numInput" class="num-input" min="0" inputmode="numeric">
    <p class="mini">Введи число и нажми «Проверить».</p>`;

  const inp = $('numInput');
  inp.addEventListener('input', () => {
    $('checkBtn').disabled = inp.value.trim() === '';
  });
  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !$('checkBtn').disabled) $('checkBtn').click();
  });
  inp.focus();
}

function buildFindError(t, area){
  let html = `<div class="qtext">${t.q}</div>
    <div class="program-stack" id="programStack">`;

  t.program.forEach((b, i) => {
    const col = C[b.color] || '#FFAB19';
    if(b.kind === 'loop'){
      html += `<button class="prog-cblk" data-i="${i}" style="background:${col};border:none;cursor:pointer;font-family:inherit">
        <div class="prog-cblk-head">${esc(b.text)}</div>
        <div class="prog-cblk-body">${b.empty ? '(пусто)' : ''}</div>
      </button>`;
    } else {
      const cls = 'prog-block' + (b.kind === 'hat' ? ' hat' : '');
      html += `<button class="${cls}" data-i="${i}" style="background:${col}">${b.text}</button>`;
    }
  });
  html += `</div>`;
  area.innerHTML = html;

  area.querySelectorAll('.prog-cblk, .prog-block').forEach(btn => {
    btn.addEventListener('click', () => {
      if(state.locked) return;
      area.querySelectorAll('.prog-cblk, .prog-block')
          .forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      state.selected = +btn.dataset.i;
      $('checkBtn').disabled = false;
    });
  });
}

/* =========================================================
   ПРОВЕРКА ОТВЕТА
   ========================================================= */
$('checkBtn').addEventListener('click', () => {
  const t = TASKS[state.taskIdx];
  let ok = false, student = '', correct = '';

  if(t.type === 'choice'){
    student = t.options[state.selected];
    correct = t.options[t.correct];
    ok = state.selected === t.correct;
    $('taskArea').querySelectorAll('.opt').forEach((b, i) => {
      b.classList.remove('sel');
      b.disabled = true;
      if(i === t.correct) b.classList.add('correct');
      else if(i === state.selected) b.classList.add('wrong');
    });
  }
  else if(t.type === 'order'){
    student = state.order.map(x => stripHTML(x.text)).join(' → ');
    correct = t.items.map(stripHTML).join(' → ');
    ok = state.order.every((x, i) => x.id === i);
    $('taskArea').querySelectorAll('.block-item').forEach(b => b.disabled = true);
  }
  else if(t.type === 'match'){
    ok = t.pairs.every((p, i) =>
      state.matches[i] !== undefined &&
      state.matchRights[state.matches[i]] === p.r);
    student = t.pairs.map((p, i) =>
      `${p.l} → ${state.matches[i] !== undefined ? state.matchRights[state.matches[i]] : '—'}`
    ).join('; ');
    correct = t.pairs.map(p => `${p.l} → ${p.r}`).join('; ');
    paintMatch(t);
  }
  else if(t.type === 'number'){
    const v = $('numInput').value.trim();
    student = v || '(пусто)';
    correct = String(t.answer);
    ok = v !== '' && Number(v) === t.answer;
    $('numInput').disabled = true;
  }
  else if(t.type === 'findError'){
    student = stripHTML(t.program[state.selected].text);
    correct = stripHTML(t.program[t.correct].text);
    ok = state.selected === t.correct;
    $('taskArea').querySelectorAll('.prog-cblk, .prog-block').forEach((b, i) => {
      b.disabled = true;
      b.classList.remove('sel');
      if(i === t.correct) b.classList.add('correct');
      else if(i === state.selected) b.classList.add('wrong');
    });
  }

  state.locked = true;
  state.results.push({
    num: state.taskIdx + 1,
    level: t.level,
    q: stripHTML(t.q),
    student: student,
    correct: correct,
    ok: ok
  });

  if(ok){
    state.streak++;
    if(state.streak > state.maxStreak) state.maxStreak = state.streak;
    const r = $('checkBtn').getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top);
  } else {
    state.streak = 0;
  }
  $('streakBox').textContent = `🔥 ${state.streak} подряд`;
  $('streakBox').className = 'streak' + (state.streak >= 2 ? ' on' : '');

  const fb = $('feedback');
  fb.className = 'feedback show ' + (ok ? 'ok' : 'err');
  fb.innerHTML = ok
    ? `✅ <b>Верно!</b> ${t.type === 'choice' ? '' : 'Молодец!'}`
    : `❌ <b>Неверно.</b> Правильный ответ: <span style="color:#1E8B4E">${esc(correct)}</span>`;

  $('checkBtn').style.display = 'none';
  $('nextBtn').style.display = '';
});

/* =========================================================
   СЛЕДУЮЩЕЕ ЗАДАНИЕ
   ========================================================= */
$('nextBtn').addEventListener('click', () => {
  if(state.taskIdx < TASKS.length - 1){
    state.taskIdx++;
    renderTask();
  } else {
    showReport();
  }
});

/* =========================================================
   ОТЧЁТ
   ========================================================= */
function showReport(){
  const total = state.results.filter(r => r.ok).length;
  const max = TASKS.length;
  const pct = total / max;

  let grade, label;
  if(pct >= 0.9){ grade = 5; label = 'Отлично'; }
  else if(pct >= 0.75){ grade = 4; label = 'Хорошо'; }
  else if(pct >= 0.5){ grade = 3; label = 'Удовлетворительно'; }
  else { grade = 2; label = 'Нужно повторить тему'; }

  const byLevel = { know:0, under:0, app:0 };
  const byLevelMax = { know:0, under:0, app:0 };
  state.results.forEach(r => {
    byLevelMax[r.level]++;
    if(r.ok) byLevel[r.level]++;
  });

  const errors = state.results.filter(r => !r.ok);

  let errHtml = errors.length === 0
    ? `<div class="no-errors">🎉 Ошибок нет! Ты отлично разобрался в циклах Scratch!</div>`
    : errors.map(e => `
      <div class="err-item">
        <div class="err-q">№${e.num}. ${esc(e.q)}</div>
        <div class="err-a wrong">✖ Твой ответ: ${esc(e.student)}</div>
        <div class="err-a right">✔ Правильный ответ: ${esc(e.correct)}</div>
      </div>`).join('');

  $('reportArea').innerHTML = `
    <div class="report-head">
      <div style="display:flex;justify-content:center;margin-bottom:4px">${catSVG(70)}</div>
      <h1>🏆 Отчет по практической работе</h1>
      <p class="sub">Тема: «Циклы в Scratch» · 3 класс</p>
    </div>

    <div class="report-grid">
      <div class="rep-item"><span>Имя ученика</span><b>${esc(state.name)}</b></div>
      <div class="rep-item"><span>Оценка</span><b class="grade g${grade}">${grade} (${label})</b></div>
      <div class="rep-item"><span>Баллы</span><b>${total} / ${max}</b></div>
      <div class="rep-item"><span>Знание</span><b>${byLevel.know} / ${byLevelMax.know}</b></div>
      <div class="rep-item"><span>Понимание</span><b>${byLevel.under} / ${byLevelMax.under}</b></div>
      <div class="rep-item"><span>Применение</span><b>${byLevel.app} / ${byLevelMax.app}</b></div>
    </div>

    <h2 class="sect">🔍 Разбор ошибок (${errors.length})</h2>
    ${errHtml}

    <div class="center">
      <button class="btn btn-orange btn-big" id="againBtn">🔄 Пройти снова</button>
    </div>
  `;

  $('againBtn').addEventListener('click', () => {
    state.name = '';
    state.taskIdx = 0;
    state.hintsLeft = 5;
    state.results = [];
    state.streak = 0;
    state.maxStreak = 0;
    state.locked = false;
    $('nameInput').value = '';
    $('startBtn').disabled = true;
    updateHintBtn();
    showScreen('screen-start');
  });

  showScreen('screen-report');
  $('taskBar').style.width = '100%';
}

/* =========================================================
   ИНИЦИАЛИЗАЦИЯ
   ========================================================= */
updateHintBtn();
</script>
